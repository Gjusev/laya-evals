[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya-evals"
version = "0.1.0"
description = "LLM-as-judge and calibration auditing for System 1 decision models: rubric scoring in CI plus reliability diagrams, ECE and coverage/accuracy thresholds by option count"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["llm-evals", "ai-evaluation", "calibration", "ci-cd", "laya", "system-one"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = ["laya>=0.3"]

[project.urls]
Homepage = "https://github.com/Gjusev/laya-evals"
Repository = "https://github.com/Gjusev/laya-evals"
Issues = "https://github.com/Gjusev/laya-evals/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
compare = ["kagglehub>=0.3", "pyarrow>=15", "datasets>=2.19"]

[tool.hatch.build.targets.wheel]
packages = ["src/laya_evals"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/brag-output",
    "/docs",
    "/kaggle-kernel",
    "/research",
    "/results",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: tests that load real laya checkpoints and may download them (opt-in with: pytest -m slow)",
]
addopts = "-m 'not slow'"
